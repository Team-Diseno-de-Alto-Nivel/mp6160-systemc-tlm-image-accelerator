name: Build

on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'CMakeLists.txt'
              - 'Makefile'
              - '.devcontainer/**'
              - 'scripts/**'
              - '.github/workflows/**'

  build:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install Pillow numpy

      - name: Prepare simulation input (use existing image or generate one)
        run: python scripts/prepare_input.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: systemc-tlm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and run simulation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            systemc-tlm:ci \
            make run

      - name: Convert RAW output → JPG
        run: python scripts/raw_to_jpg.py images/output/salida.raw images/output/salida.jpg --gray

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-images
          path: |
            images/input/test.jpg
            images/output/salida.jpg
