name: Build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: systemc-tlm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate test input image
        run: |
          mkdir -p images/input
          dd if=/dev/urandom of=images/input/imagen.raw bs=1 count=6220800

      - name: Build and run simulation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            systemc-tlm:ci \
            make run

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-images
          path: |
            images/input/imagen.raw
            images/output/salida.raw
