name: Update results

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.devcontainer/**'
      - 'scripts/**'
      - 'images/input/**'

jobs:
  simulate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install Pillow numpy

      - name: Prepare simulation input
        run: python scripts/prepare_input.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dev container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: systemc-tlm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and run simulation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            systemc-tlm:ci \
            make run

      - name: Convert RAW output → JPG
        run: python scripts/raw_to_jpg.py images/output/output.raw images/output/output.jpg --gray

      - name: Publish results as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete simulation-results --yes --cleanup-tag 2>/dev/null || true
          gh release create simulation-results \
            --title "Simulation Results" \
            --notes "Auto-updated by CI on every push to main that touches src/." \
            --latest=false \
            images/input/image.jpg#"Input RGB (1920×1080)" \
            images/output/output.jpg#"Output Grayscale (1920×1080)"
